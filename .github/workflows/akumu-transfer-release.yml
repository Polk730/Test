name: Publish complete AKUMU transfer
on:
  push:
    branches: [akumu-download-20261110]
    paths:
      - .github/workflows/akumu-transfer-release.yml
      - antigravity-transfer/**
permissions:
  contents: write
concurrency:
  group: akumu-antigravity-transfer-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out transfer files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reassemble and verify the original complete ZIP
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          folder = Path('antigravity-transfer')
          manifest = json.loads((folder / 'SHA256.json').read_text())
          output = folder / manifest['complete_zip']['file']
          with output.open('wb') as target:
              for part in manifest['parts']:
                  path = folder / part['file']
                  assert path.stat().st_size == part['bytes'], path
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == part['sha256'], path
                  with path.open('rb') as source:
                      shutil.copyfileobj(source, target)
          assert output.stat().st_size == manifest['complete_zip']['bytes']
          assert hashlib.sha256(output.read_bytes()).hexdigest() == manifest['complete_zip']['sha256']
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
          print('Complete original ZIP successfully reconstructed and verified.')
      - name: Publish downloadable ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRANSFER_COMMIT: ${{ github.sha }}
        run: |
          tag=akumu-antigravity-2026-11-12
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$TRANSFER_COMMIT" --title 'AKUMU — Complete Antigravity Transfer' --notes-file antigravity-transfer/AKUMU-Antigravity-Handoff.md
          fi
          gh release upload "$tag" antigravity-transfer/AKUMU-Antigravity-Complete.zip antigravity-transfer/AKUMU-Antigravity-Current.zip antigravity-transfer/AKUMU-Antigravity-Handoff.md antigravity-transfer/SHA256.json --clobber
